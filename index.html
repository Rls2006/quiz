<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de programação - Estácio</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 450px;
            border-top: 5px solid #007acc;
        }
        h1 { font-size: 1.5rem; color: #007acc; text-align: center; }
        .pergunta { margin-bottom: 20px; font-weight: bold; min-height: 50px; }
        .opcao {
            background: #2d2d2d;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #3d3d3d;
        }
        .opcao:hover { background: #3d3d3d; border-color: #007acc; }
        #feedback { text-align: center; font-weight: bold; margin-top: 15px; height: 20px; }
        #start-button {
            width: 100%;
            padding: 14px 16px;
            background: #007acc;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #start-button:hover {
            background: #005ea3;
        }
    </style>
</head>
<body>

  <div class="quiz-container">
        <div id="start-screen">
            <h1>Quiz de Programação</h1>
            <p style="text-align:center; color:#bbb; margin: 15px 0 20px;">Teste seus conhecimentos em Python e veja quantas questões você acerta.</p>
            <button id="start-button">Iniciar Quiz</button>
        </div>

        <div id="quiz-content" style="display: none;">
            <h1>Quiz de programação</h1>
            <p style="text-align:center; color:#bbb; margin-top:-10px; margin-bottom:20px;">Responda e descubra quantas questões você acerta.</p>
            <hr style="border: 0.5px solid #333; margin-bottom: 20px;">

            <div id="enunciado" class="pergunta">Carregando pergunta...</div>
            <div id="opcoes-container"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        const perguntas = [
            {
                titulo: "Cite algumas razões para estudarmos Python.",
                opcoes: ["A) Sintaxe simples", "B) Suporte IA", "C) Memória manual", "D) Versatilidade Web e Automação"],
                correta: 2 // Letra C
            },
            {
                titulo: "Qual comando usamos para ler um dado do teclado?",
                opcoes: ["A) input()", "B) print()", "C) read()", "D) scan()"],
                correta: 0 // Letra A
            },  
            {
                titulo: "Qual das alternativas abaixo NÃO é uma razão comum para estudarmos Python?",
                opcoes: ["A) Sintaxe simples e legível.", "B) Grande suporte para IA e Dados.", "C) Gerenciamento manual de memória.", "D) Versatilidade para Web e Automação."],
                correta: 2 // Letra C
            },
            {
                titulo: "Em Python, qual é o método construtor de uma classe?",
                opcoes: ["A) __start__", "B) __init__", "C) self", "D) main"],
                correta: 1 // Letra B
            },
            {
                titulo: "Qual estrutura é usada para iterar sobre uma lista em Python?",
                opcoes: ["A) for", "B) if", "C) def", "D) import"],
                correta: 0 // Letra A
            },
            {
                titulo: "Qual é a função usada para imprimir algo na tela em Python?",
                opcoes: ["A) print()", "B) input()", "C) echo()", "D) display()"],
                correta: 0 // Letra A
            },
            {
                titulo: "Como você pode determinar o tipo de uma variável em Python?",
                opcoes: ["A) type()", "B) Len()", "C) str", "D) var()"],
                correta: 0 // Letra A
            },
            {
                titulo: "Quais dessas opções pode ser considerada uma variável em Python?",
                opcoes: ["A) 5", "B) 'olá'", "C) True", "D) None"],
                correta: 0 // Letra A
            },
             {
                titulo: "Qual a sintaxe correta para criar uma função em python?",
                opcoes: ["A)function minha_funcao():", "B)def minha_funcao():", "C)create minha_funcao():", "D)funcao minha_funcao():"],
                correta: 1 // Letra B
            },
            {
                titulo: "Qual deles não é um tipo primitivo em python?",
                opcoes: ["A) int", "B) str", "C) bool", "D) list"],
                correta: 3 // Letra D
            },
            {
                titulo: "Como você cria uma variável com o valor 5 em python?",
                opcoes: ["A) var x= 5", "B) x= 5", "C) let x= 5", "D) x:= 5"],
                correta: 1 // Letra B
            },
            {
                titulo: "Como você cria uma variável com o valor flutuante 2.8 em python?",
                opcoes: ["A) var x= 2.8", "B) x= 2.8", "C) Let x= 2.8", "D) x:= 2.8"],
                correta: 1 // Letra B
            }
        ];

        let indiceAtual = 0;
        let pontos = 0;

        function carregarPergunta() {
            const questao = perguntas[indiceAtual];
            document.getElementById('enunciado').innerText = questao.titulo;
            document.getElementById('feedback').innerText = "";
            
            const container = document.getElementById('opcoes-container');
            container.innerHTML = ""; // Limpa as opções antigas

            questao.opcoes.forEach((texto, index) => {
                const div = document.createElement('div');
                div.classList.add('opcao');
                div.innerText = texto;
                div.onclick = () => verificarResposta(index, questao.correta);
                container.appendChild(div);
            });
        }

            function verificarResposta(escolhida, correta) {
            const questao = perguntas[indiceAtual];
            const feedback = document.getElementById('feedback');
            const letras = ["A", "B", "C", "D"];

            if (escolhida === correta) {
                pontos += 1;
                feedback.innerText = "Correto! ✅";
                feedback.style.color = "#4caf50";
            } else {
                feedback.innerText = `Errado! ❌ A resposta correta era ${letras[questao.correta]}.`;
                feedback.style.color = "#f44336";
            }

            document.querySelectorAll('.opcao').forEach(opcao => {
                opcao.onclick = null;
                opcao.style.cursor = 'default';
            });

            setTimeout(() => {
                indiceAtual++;
                if (indiceAtual < perguntas.length) {
                    carregarPergunta();
                } else {
                    document.querySelector('.quiz-container').innerHTML = "<h1>Fim do Quiz,você acertou " + pontos + " de " + perguntas.length + "! 🏆</h1><p style='text-align:center'>Você completou todos os temas.</p>";
                }
            }, 1500);
        }

        function iniciar() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            carregarPergunta();
        }

        document.getElementById('start-button').onclick = iniciar;
    </script>
</body>
</html>
